
services:
  back-end:
    build:
      context: ./back-end

    container_name: project-manager-backend

    ports:
      - "8000:8000"

    env_file:
      - ./back-end/.env

    environment:
      PORT: "8000"
      HOST: "0.0.0.0"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  front-end:
    build:
      context: ./front-end

    container_name: project-manager-frontend

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://back-end:8000

    depends_on:
      back-end:
        condition: service_healthy

    restart: unless-stopped
