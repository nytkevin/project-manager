name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  front-end:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front-end

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend API URL
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::error::The NEXT_PUBLIC_API_URL repository variable must be configured."
            exit 1
          fi

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          npm run build
          grep -R -F "$NEXT_PUBLIC_API_URL" .next/static

  back-end:
    name: FastAPI Checks
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

    defaults:
      run:
        working-directory: back-end

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: back-end/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Check backend imports
        run: python -c "import app.main; print('App import successful')"

      - name: Run backend tests
        run: pytest

  docker:
    name: ARM64 Docker Build Checks
    runs-on: ubuntu-latest
    needs:
      - front-end
      - back-end

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate frontend API URL
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::error::The NEXT_PUBLIC_API_URL repository variable must be configured."
            exit 1
          fi

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./front-end
          platforms: linux/arm64
          push: false
          tags: project-manager-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./back-end
          platforms: linux/arm64
          push: false
          tags: project-manager-backend:ci

  publish:
    name: Publish ARM64 Images
    runs-on: ubuntu-latest
    needs:
      - docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate frontend API URL
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::error::The NEXT_PUBLIC_API_URL repository variable must be configured before publishing."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./front-end
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/nytkevin/project-manager-frontend:latest
            ghcr.io/nytkevin/project-manager-frontend:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./back-end
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/nytkevin/project-manager-backend:latest
            ghcr.io/nytkevin/project-manager-backend:sha-${{ github.sha }}

  deploy:
    name: Deploy to Oracle
    runs-on: ubuntu-latest
    needs:
      - publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Validate deployment secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in ORACLE_HOST ORACLE_USER ORACLE_SSH_KEY ORACLE_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name repository secret must be configured before deployment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure SSH
        env:
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Deploy images
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -o BatchMode=yes "$ORACLE_USER@$ORACLE_HOST" <<'REMOTE'
            set -eu
            cd "$HOME/project-manager"
            docker compose pull front-end back-end
            docker compose up -d --force-recreate front-end back-end
            docker compose ps
            test "$(docker inspect --format '{{.State.Running}}' project-manager-frontend)" = "true"
            test "$(docker inspect --format '{{.State.Running}}' project-manager-backend)" = "true"
            curl --fail --silent --show-error http://127.0.0.1:8000/health
            printf '\nDeployment health check passed.\n'
          REMOTE
